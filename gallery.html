
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Galería de viajes</title>

        <!-- Aplica a Galería los estilos que hemos creado -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header>
            <h1>Galería de viajes</h1>
            <p>Explora algunos de los lugares más especiales de París, Londres y Tokio.</p>
        </header>

        <main>
            <section class="photo-gallery">
                <ul>
                    <li>
                        <figure>
                            <img src="images/paris.jpg" alt="Vista de la Torre Eiffel en París">
                            <figcaption>La Torre Eiffel representa la belleza y la elegancia de París.</figcaption>
                        </figure>
                    </li>

                    <li>
                        <figure>
                            <img src="images/londres.jpg" alt="Vista del Big Ben en Londres">
                            <figcaption>El Big Ben representa la historia y el carácter clásico de Londres.</figcaption>
                        </figure>
                    </li>

                    <li>
                        <figure>
                            <img src="images/tokio.jpg" alt="Calles iluminadas de Tokio">
                            <figcaption>Las calles de Tokio muestran su sorprendente combinación de tradición y tecnología.</figcaption>
                        </figure>
                    </li>
                </ul>
            </section>
        </main>

         <!-- Enlace para volver a la página principal -->
        <p>
            <a href="proyecto_final.html">← Volver al inicio</a>
        </p>

    </body>
</html>
