
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Suscripción</title>

        <!-- Aplica a suscripción los estilos que ya hemos creado -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header>
            <h1>Suscríbete a nuestras aventuras</h1>
            <p>Recibe por correo electrónico nuestras nuevas historias y recomendaciones de viaje</p>
        </header>

        <main>
            <form method="post">
                <div>
                    <label for="email-suscripcion">Correo electrónico:</label>
                    <input type="email" id="email-suscripcion" name="email" placeholder="Escribe tu correo electrónico" required>
                </div>

                <div>
                    <input type="checkbox" id="confirmacion" name="confirmacion" required>
                    <label for="confirmacion">Acepto recibir noticias y recomendaciones de viaje</label>
                </div>

                <div>
                    <button type="submit">Suscribirme</button>
                </div>
            </form>
        </main>

        <!-- Enlace para volver a la página principal -->
        <p>
            <a href="proyecto_final.html">← Volver al inicio</a>
        </p>

    </body>
</html>
